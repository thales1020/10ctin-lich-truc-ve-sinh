<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch trực vệ sinh — 10 CTin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="banner">
    <h1>🧹 Lịch trực vệ sinh — Lớp 10 CTin</h1>
    <p class="subtitle">THPT Thoại Ngọc Hầu · 5 tổ · Thứ 2 – Thứ 6</p>
    <div id="countdown" class="countdown"></div>
  </header>

  <main id="app">
    <div id="status" class="status-msg" hidden></div>

    <section id="week-current" class="week-block"></section>
    <section id="week-next" class="week-block"></section>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal-content"></div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" src="" alt="Ảnh trực vệ sinh" />
  </div>

  <footer class="footer">
    <p>Đăng ký trước 0h Thứ 2 để giành ngày cho tuần sau. Qua hạn, các ngày còn trống sẽ được random chia cho tổ chưa đăng ký.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
