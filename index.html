<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch trực vệ sinh</title>
  <meta name="description" content="Bảng đăng ký ngày trực vệ sinh của 5 tổ, lớp 10 CTin — THPT Thoại Ngọc Hầu." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="banner">
      <div class="banner-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🧹</span>
          <div class="brand-text">
            <h1>Lịch trực vệ sinh</h1>
            <p class="subtitle">Lớp 10 CTin · THPT Thoại Ngọc Hầu</p>
          </div>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Đổi giao diện sáng / tối">
          <span class="icon" id="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span id="theme-toggle-label">Chế độ tối</span>
        </button>
      </div>
      <div id="countdown" class="countdown"></div>
    </header>

    <main id="app">
      <section id="today-hero" class="today-hero" aria-live="polite"></section>

      <div id="status" class="status-msg" hidden></div>

      <section id="week-current" class="week-block"></section>
      <section id="week-next" class="week-block"></section>
    </main>

    <footer class="footer">
      <p>Đăng ký trước 0h Thứ 2 để giành ngày cho tuần sau. Qua hạn, các ngày còn trống sẽ được random chia cho tổ chưa đăng ký.</p>
    </footer>
  </div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal-content"></div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <img id="lightbox-img" src="" alt="Ảnh trực vệ sinh" />
  </div>

  <script src="app.js"></script>
</body>
</html>
